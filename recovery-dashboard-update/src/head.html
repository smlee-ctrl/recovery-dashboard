<title>Recovery Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: fixed drawn landscape behind everything; frosted-glass panels float over it. Resizable score widgets on a 4-column grid, then analysis, body map, logging, trends. Single dark look by choice. */
:root{
  --ink:#0B0D12; --text:#F5F7FA; --muted:rgba(235,240,247,.68); --faint:rgba(235,240,247,.42);
  --glass:rgba(255,255,255,.10); --glass-2:rgba(255,255,255,.06); --glass-dense:rgba(14,17,24,.52);
  --edge:rgba(255,255,255,.18); --edge-soft:rgba(255,255,255,.09);
  --ok:#8FE0C6; --warn:#F6CD72; --bad:#F59384;
  --deep:#7D9BFF; --rem:#B9A8FF; --light:rgba(255,255,255,.22); --hrv:#8FE0C6; --rhr:#FFB38A;
  --sans:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ink);color:var(--text);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.app{position:relative;z-index:1;max-width:1180px;margin:0 auto;display:grid;gap:22px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 56px}
h1,h2,h3,p{margin:0}
h1{font-size:30px;font-weight:600;letter-spacing:-.01em}
h2{font-size:21px;font-weight:600;text-wrap:balance}
h3{font-size:16px;font-weight:600}
.muted{color:var(--muted);font-size:13px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}

.glass{background:linear-gradient(140deg,rgba(255,255,255,.16),rgba(255,255,255,.05) 60%);border:1px solid var(--edge);border-radius:24px;
  -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 12px 40px rgba(0,0,0,.28)}
.glass.dense{background:linear-gradient(140deg,rgba(28,32,42,.62),rgba(14,17,24,.5));border-color:var(--edge-soft)}
.card{padding:22px;display:grid;gap:12px;align-content:start;min-width:0;position:relative}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--edge);background:var(--glass);color:var(--text);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer;
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.pill:hover{background:rgba(255,255,255,.18)}
.pill:disabled{opacity:.35;cursor:default}
.pill[aria-pressed="true"]{background:var(--text);color:var(--ink);border-color:var(--text)}
.day{min-width:12ch;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.kbonly{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.kbonly:focus-visible,.kbonly[aria-pressed="true"]{position:static;width:auto;height:auto;overflow:visible;clip:auto}
.hint{font-size:12px;color:var(--faint)}
.board.holding,.board.holding *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.board.editing .tile{cursor:grab}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.status.on i{background:var(--ok)}
.status.off i{background:var(--warn)}
.acct{border:0;background:none;color:var(--text);font:inherit;font-size:12px;font-weight:600;text-decoration:underline;text-underline-offset:2px;cursor:pointer;padding:0 0 0 4px}
.acct:focus-visible{outline:2px solid var(--text);outline-offset:2px;border-radius:4px}
.banner{padding:12px 16px;font-size:14px;color:var(--text)}

/* board + customizing */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;align-items:start}
@media (max-width:760px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{position:relative;min-width:0;grid-column:span 4}
.tchrome{position:absolute;top:-15px;right:18px;z-index:6;display:none;gap:6px}
.board.editing .tchrome{display:flex}
.tchrome button{border:1px solid rgba(255,255,255,.35);background:rgba(12,14,20,.78);color:#fff;font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;cursor:pointer;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tchrome .grip{cursor:grab;touch-action:none;display:inline-flex;align-items:center;gap:6px}
.tchrome .grip svg{width:12px;height:12px}
.rsz{position:absolute;top:50%;right:-9px;transform:translateY(-50%);width:14px;height:56px;border-radius:7px;background:rgba(255,255,255,.88);box-shadow:0 2px 10px rgba(0,0,0,.4);cursor:ew-resize;touch-action:none;z-index:6;display:none}
.rsz::after{content:"";position:absolute;inset:18px 5px;border-left:1.5px solid rgba(10,12,16,.5);border-right:1.5px solid rgba(10,12,16,.5)}
.board.editing .rsz{display:block}
.board.editing .tile{outline:1.5px dashed rgba(255,255,255,.4);outline-offset:5px;border-radius:24px}
.board.editing .tile > :not(.tchrome):not(.rsz){pointer-events:none;user-select:none}
.tile.lifted{cursor:grabbing;will-change:left,top,transform;outline:none !important}
.tile.lifted.settling{transition:left .26s cubic-bezier(.2,.8,.2,1),top .26s cubic-bezier(.2,.8,.2,1),box-shadow .26s}
.tile.ph{border-radius:24px;background:rgba(255,255,255,.05);outline:1.5px dashed rgba(255,255,255,.4);outline-offset:-1.5px;min-height:120px}
.tile.resizing{outline-color:#fff !important}
.spanbadge{position:absolute;bottom:10px;right:14px;z-index:6;font-size:11px;font-weight:700;color:#fff;background:rgba(12,14,20,.78);padding:4px 8px;border-radius:999px;display:none}
.board.editing .spanbadge{display:block}
#editbar.editbar{padding:14px 18px;display:grid;gap:10px;position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(760px,calc(100% - 32px));z-index:45;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.editbar b{font-weight:600}
.editrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hiddenlist{display:flex;gap:6px;flex-wrap:wrap}
.w{padding:18px 18px 20px;display:grid;gap:10px;align-content:start;min-width:0;min-height:260px}
.whead{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:30px}
.wbody{display:grid;gap:14px;min-width:0}
.w[data-size="M"] .wbody{grid-template-columns:minmax(0,200px) minmax(0,1fr);align-items:center}
.w[data-size="L"] .wbody{grid-template-columns:minmax(0,240px) minmax(0,1fr) minmax(0,1fr);align-items:start}
@media (max-width:760px){.w[data-size="M"] .wbody,.w[data-size="L"] .wbody{grid-template-columns:minmax(0,1fr)}}
.gauge svg{display:block;width:100%;height:auto;overflow:visible;max-width:240px;margin-inline:auto}
.headline{font-size:22px;font-weight:600}
.msg{color:var(--muted);font-size:14px;line-height:1.5}
.kv{display:grid;gap:8px}
.kv div{display:flex;justify-content:space-between;gap:10px;font-size:14px;border-top:1px solid var(--edge-soft);padding-top:8px}
.kv div:first-child{border-top:0;padding-top:0}
.kv span:first-child{color:var(--muted)}
.kv b{font-weight:600;font-variant-numeric:tabular-nums}
.stages{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--light)}
.spark{display:flex;align-items:end;gap:5px;height:64px}
.spark i{flex:1;border-radius:4px 4px 2px 2px;min-height:3px;position:relative}
.spark i.cur{outline:1.5px solid #fff;outline-offset:1px}
.sparklab{display:flex;justify-content:space-between;font-size:11px;color:var(--faint)}
.empty{color:var(--muted);font-size:14px}

/* analysis */
.causes{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,16.5rem),1fr))}
.cause{background:rgba(0,0,0,.22);border-radius:18px;padding:16px;display:grid;gap:8px;align-content:start;border-top:3px solid var(--sev)}
.cause .t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:color-mix(in srgb,var(--sev) 20%,transparent);color:var(--sev);white-space:nowrap}
.src{font-size:11px;color:var(--faint);letter-spacing:.04em;text-transform:uppercase}
.cause .ev{font-size:13px;color:var(--muted)}
.cause .fix{font-size:14px;border-top:1px solid var(--edge-soft);padding-top:8px}

/* muscles */
.heat{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.heat{grid-template-columns:minmax(0,1fr)}}
.bodies{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bodies figure{margin:0;display:grid;justify-items:center;gap:4px}
.figwrap{position:relative;width:100%;max-width:200px}
.bodies svg{width:100%;height:auto;display:block;position:relative;z-index:1}
.syn{position:absolute;left:0;top:0;pointer-events:none;z-index:2;mix-blend-mode:screen}
.bodies figcaption{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.sil{fill:rgba(255,255,255,.07);stroke:rgba(255,255,255,.16);stroke-width:.6}
.mus{cursor:pointer;outline:none}
.mus path{stroke:rgba(8,10,14,.85);stroke-width:.7;stroke-linejoin:round;transition:fill .35s}
.mus path.fib{stroke:none;pointer-events:none}
.mus:hover path:not(.fib){stroke:rgba(255,255,255,.85)}
.mus.sel path:not(.fib){stroke:#fff;stroke-width:1.1}
.mus:focus-visible path:not(.fib){stroke:#fff;stroke-width:1.4}
.ramp{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.ramp span.r{flex:1;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--bad),var(--warn),var(--ok))}
.lifts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lift{background:rgba(0,0,0,.22);border-radius:14px;padding:12px;display:grid;gap:6px}
.lift .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lift .v{font-size:30px;font-weight:300;font-variant-numeric:tabular-nums}
.bar{height:4px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px}
.lift .wh{font-size:12px;color:var(--muted);min-height:2.4em}
.mdetail{background:rgba(0,0,0,.22);border-radius:14px;padding:14px 16px;display:grid;gap:6px}
.mdetail p{font-size:14px;color:var(--muted)}
.tag{font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;color:#10131A;white-space:nowrap}

/* logging */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.panel{display:grid;gap:16px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,9.5rem),1fr));gap:10px}
.field{display:grid;gap:5px;font-size:12px;color:var(--muted);min-width:0}
.field input,.field select,.field textarea{font:inherit;font-size:15px;color:var(--text);background:rgba(0,0,0,.28);border:1px solid var(--edge-soft);border-radius:12px;padding:9px 11px;width:100%;min-width:0}
.field textarea{min-height:64px;resize:vertical}
.field input:focus-visible,.field select:focus-visible,.field textarea:focus-visible{outline:2px solid var(--text);outline-offset:1px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.check{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;border:1px solid var(--edge-soft);background:rgba(0,0,0,.22);font-size:13px;cursor:pointer}
.check input{accent-color:#fff;margin:0}
.check:has(input:checked){background:rgba(255,255,255,.88);color:var(--ink);border-color:transparent}
.rested{display:flex;gap:6px}
.rested button{flex:1;border:1px solid var(--edge-soft);background:rgba(0,0,0,.22);color:var(--text);border-radius:12px;padding:10px 4px;font-size:13px;cursor:pointer}
.rested button[aria-pressed="true"]{background:rgba(255,255,255,.9);color:var(--ink)}
.primary{border:0;background:#fff;color:var(--ink);font-weight:700;font-size:15px;padding:12px 18px;border-radius:999px;cursor:pointer;justify-self:start}
.primary:disabled{opacity:.35;cursor:default}
.ghost{border:1px solid var(--edge);background:transparent;color:var(--text);font-size:13px;padding:8px 14px;border-radius:999px;cursor:pointer}
.ghost:disabled{opacity:.35;cursor:default}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:820px){.split{grid-template-columns:minmax(0,1fr)}}
.drop{border:1.5px dashed rgba(255,255,255,.3);border-radius:16px;padding:18px 14px;display:grid;justify-items:center;gap:4px;text-align:center;cursor:pointer;background:rgba(0,0,0,.18);position:relative}
.drop:hover,.drop.over{border-color:#fff}
.drop:focus-within{outline:2px solid #fff;outline-offset:2px}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
video{width:100%;max-height:320px;border-radius:14px;background:#000;display:block}
.marks{display:flex;gap:6px;flex-wrap:wrap}
.reps{display:flex;gap:6px;align-items:end;height:64px}
.reps i{flex:1;max-width:34px;border-radius:4px 4px 2px 2px}
.draft{display:grid;gap:8px}
.draftrow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:rgba(0,0,0,.22);border-radius:12px;padding:10px 12px;font-size:14px}
.note{font-size:12px;color:var(--faint)}
.msgline{font-size:13px;color:var(--ok);min-height:1.3em}
.msgline.err{color:var(--bad)}

.daylog{display:grid;gap:14px}
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,7rem),1fr));gap:8px}
.tot{background:rgba(0,0,0,.22);border-radius:14px;padding:10px 12px}
.tot b{display:block;font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.tot span{font-size:12px;color:var(--muted)}
.entries{display:grid;gap:8px}
.entry{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;background:rgba(0,0,0,.2);border-radius:14px;padding:12px 14px}
.entry .ic{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);background:rgba(255,255,255,.85);border-radius:6px;padding:3px 6px}
.entry .d{font-size:13px;color:var(--muted)}
.entry video{max-height:220px;margin-top:8px}

/* diary-style logging */
.week{display:grid;gap:10px}
.weekhead{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dayb{border:0;background:transparent;color:var(--muted);display:grid;justify-items:center;gap:6px;padding:4px 0;cursor:pointer;font:inherit;border-radius:12px}
.dayb .dot{width:4px;height:4px;border-radius:50%;background:transparent}
.dayb.today .dot{background:var(--text)}
.dayb .l{font-size:13px;font-weight:600;letter-spacing:.04em}
.dayb .c{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.45);display:grid;place-items:center}
.dayb .c svg{width:16px;height:16px;opacity:0}
.dayb.done .c{background:#fff;border-color:#fff}
.dayb.done .c svg{opacity:1;color:var(--ink)}
.dayb.sel .l{color:var(--text)}
.dayb.sel .c{box-shadow:0 0 0 3px rgba(255,255,255,.22)}
.dayb:disabled{opacity:.3;cursor:default}
.logview{display:grid;gap:12px}
.sumcard{background:rgba(255,255,255,.07);border:1px solid var(--edge-soft);border-radius:20px;padding:18px 20px;display:grid;gap:12px;position:relative}
.sumcard .lab{font-size:15px;color:var(--muted)}
.sumcard .big{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sumcard .big b{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.sumcard .big .of{font-size:15px;color:var(--muted);font-weight:400}
.sumcard .big .left{font-size:14px;color:var(--muted)}
.pbar{height:8px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:4px;transition:width .4s}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tri .t{display:grid;gap:6px;min-width:0}
.tri .n{font-size:15px}
.tri .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tri .v span{font-size:13px;font-weight:400;color:var(--muted)}
.swap{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;border:1px solid var(--edge-soft);background:rgba(255,255,255,.08);color:var(--text);display:grid;place-items:center;cursor:pointer;z-index:2}
.swap svg{width:16px;height:16px}
.diaryhead{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.diaryhead h3{font-size:20px}
.linkbtn{border:0;background:none;color:var(--text);font:inherit;font-size:15px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(255,255,255,.35)}
.drow{background:rgba(255,255,255,.07);border:1px solid var(--edge-soft);border-radius:18px;padding:16px 18px;display:grid;grid-template-columns:36px minmax(0,1fr) auto auto;gap:12px;align-items:center}
.drow .ico{width:30px;height:30px;color:var(--deep)}
.drow .nm{font-size:17px;font-weight:600}
.drow .sm{font-size:14px;color:var(--muted)}
.drow .sm2{font-size:13px;color:var(--faint)}
.dots{border:0;background:none;color:var(--muted);width:34px;height:34px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.dots svg{width:20px;height:20px}
.dots[aria-expanded="true"]{background:rgba(255,255,255,.1)}
.logpill{border:0;background:rgba(125,155,255,.18);color:#C9D6FF;font:inherit;font-weight:700;font-size:15px;padding:9px 18px;border-radius:999px;cursor:pointer}
.logpill:hover{background:rgba(125,155,255,.3)}
.items{grid-column:2 / -1;display:grid;gap:6px}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;background:rgba(0,0,0,.22);border:0;color:var(--text);font:inherit;font-size:14px;text-align:left;cursor:pointer;width:100%}
.item:hover{background:rgba(0,0,0,.34)}
.item span:last-child{color:var(--muted);white-space:nowrap}
.item.ro{cursor:default}
.item video{margin-top:6px}
@media (max-width:520px){.drow{grid-template-columns:30px minmax(0,1fr) auto;}.drow .dots{display:none}.tri{gap:10px}.tri .v{font-size:17px}}

/* entry sheet */
.sheet{position:fixed;inset:0;z-index:50;display:grid;place-items:end center;padding-top:env(safe-area-inset-top,0px)}
.scrim{position:absolute;inset:0;background:rgba(5,7,10,.55)}
.sheetpanel{position:relative;width:min(720px,100%);max-height:calc(100% - 24px);display:grid;grid-template-rows:auto minmax(0,1fr);border-radius:26px 26px 0 0;overflow:hidden}
@media (min-width:760px){.sheet{place-items:center}.sheetpanel{border-radius:26px;max-height:calc(100% - 60px)}}
.sheethead{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:12px max(12px,env(safe-area-inset-left,0px)) 12px max(12px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--edge-soft)}
.sheethead h2{text-align:center;font-size:18px}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--text);display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{background:rgba(255,255,255,.1)}
.iconbtn svg{width:24px;height:24px}
.sheetbody{overflow:auto;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));overscroll-behavior:contain}
.sheetsec{display:grid;gap:18px}
.bigname{font:inherit;font-size:26px;font-weight:700;color:var(--text);background:transparent;border:0;border-bottom:1px solid var(--edge-soft);padding:6px 0 12px;width:100%}
.bigname::placeholder{color:var(--faint)}
.bigname:focus-visible{outline:none;border-bottom-color:#fff}
.rows{display:grid}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--edge-soft);font-size:16px}
.row:last-child{border-bottom:0}

/* hover tilt with glare: the pane tilts toward the pointer, the content floats a little
   above the glass, a soft glare slides with the pointer and the shadow falls the other way */
.w{transform-origin:center;will-change:transform}
.w > .wbody{transform:translate(var(--px,0px),var(--py,0px))}
.w > .whead{transform:translate(calc(var(--px,0px) * .6),calc(var(--py,0px) * .6))}
.glass.w:not(.lifted) > .gfx{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),calc(var(--sx,0) * 1px) calc(14px + var(--sy,0) * 1px) 44px rgba(0,0,0,.34)}
.glass > .glare{position:absolute;inset:0;z-index:3;border-radius:inherit;pointer-events:none;opacity:0;mix-blend-mode:soft-light;
  background:radial-gradient(circle at var(--gx,50%) var(--gy,30%),rgba(255,255,255,.85),rgba(255,255,255,.22) 30%,rgba(255,255,255,0) 58%),
    linear-gradient(115deg,rgba(255,255,255,0) 20%,rgba(255,255,255,.22) calc(var(--gx,50%) - 8%),rgba(255,255,255,0) calc(var(--gx,50%) + 18%))}
.glass > .glare::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at var(--gx,50%) var(--gy,30%),rgba(255,255,255,.18),rgba(255,255,255,0) 40%);mix-blend-mode:screen}

/* ══ Stacked bars (lab/StackedBars.tsx) ═══ */
.stb {
  --stb-c1: color-mix(in srgb, var(--fill-on, #17181a) 100%, var(--fill-slab, #ffffff));
  --stb-c2: color-mix(in srgb, var(--fill-on, #17181a) 78%, var(--fill-slab, #ffffff));
  --stb-c3: color-mix(in srgb, var(--fill-on, #17181a) 60%, var(--fill-slab, #ffffff));
  --stb-c4: color-mix(in srgb, var(--fill-on, #17181a) 44%, var(--fill-slab, #ffffff));
  --stb-c5: color-mix(in srgb, var(--fill-on, #17181a) 32%, var(--fill-slab, #ffffff));
  --stb-c6: color-mix(in srgb, var(--fill-on, #17181a) 22%, var(--fill-slab, #ffffff));
  --stb-alert: color-mix(in srgb, var(--fill-on, #17181a) 100%, var(--fill-slab, #ffffff));
  --stb-soft: color-mix(in srgb, var(--fill-on, #17181a) 72%, var(--fill-slab, #ffffff));
  --stb-mute: color-mix(in srgb, var(--fill-on, #17181a) 52%, var(--fill-slab, #ffffff));
  --stb-faint: color-mix(in srgb, var(--fill-on, #17181a) 32%, var(--fill-slab, #ffffff));
  --stb-w6: color-mix(in srgb, var(--fill-on, #17181a) 6%, transparent);
  --stb-w12: color-mix(in srgb, var(--fill-on, #17181a) 12%, transparent);
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 16px;
  box-sizing: border-box;
  border-radius: 20px;
  background: var(--fill-slab, #ffffff);
  color: var(--fill-on, #17181a);
  font-family: var(--font-ui);
  font-size: 13px;
  user-select: none;
  -webkit-user-select: none;}

.stb[data-colour="on"] {
  --stb-c1: #9d7bf5; --stb-c2: #5b8def; --stb-c3: #9ab8db;
  --stb-c4: #f2c46d; --stb-c5: #74dcae; --stb-c6: #e57bb8;
  --stb-alert: #e5484d;}

[data-stroke="on"] .stb { box-shadow: 0 0 0 1px var(--pane-edge); }

/* header: icon tile, title, Day / Week */
.stb-head { display: flex; align-items: center; gap: 12px; }

.stb-titles { flex: 1; min-width: 0; }

.stb-title { font-size: 14px; font-weight: 500; letter-spacing: -0.01em; line-height: 18px; }

.stb-sub { font-size: 12px; color: var(--stb-mute); line-height: 16px; font-variant-numeric: tabular-nums; }

.stb-seg-ctl {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1fr;
  padding: 2px;
  border-radius: 10px;
  background: var(--stb-w6);}

.stb-thumb {
  position: absolute;
  top: 2px;
  bottom: 2px;
  left: 2px;
  width: calc(50% - 2px);
  border-radius: 8px;
  background: var(--fill-slab, #ffffff);
  transition: transform 220ms cubic-bezier(0.22, 1, 0.36, 1);}

.stb-seg-ctl[data-mode="Week"] .stb-thumb { transform: translateX(100%); }

.stb-tab {
  position: relative;
  appearance: none;
  border: 0;
  background: none;
  padding: 0 10px;
  height: 28px;
  font: inherit;
  font-size: 12px;
  font-weight: 500;
  color: var(--stb-mute);
  cursor: pointer;
  border-radius: 8px;
  transition: color 160ms ease, scale 160ms cubic-bezier(0.22, 1, 0.36, 1);}

.stb-tab[data-on] { color: var(--fill-on, #17181a); }

.stb-tab:hover:not([data-on]) { color: var(--stb-soft); }

.stb-tab:active { scale: 0.96; }

.stb-tab:focus-visible { outline: 2px solid #2231dd; outline-offset: 0; }

/* the one figure */
.stb-figure { display: flex; align-items: baseline; gap: 8px; margin-bottom: -4px; }

.stb-num {
  font-size: 30px;
  font-weight: 500;
  letter-spacing: -0.03em;
  line-height: 32px;
  font-variant-numeric: tabular-nums;}

.stb-unit { font-size: 13px; color: var(--stb-mute); }

/* Price flow's pop in: each character rises a touch from below, out
   of a slight blur and from nothing, a hair past its mark — left to
   right, 70ms apart */
.stb-digit { display: inline-block; }

.stb-digit[data-pop] {
  animation: stb-pop 500ms cubic-bezier(0.34, 1.45, 0.64, 1) both;
  animation-delay: calc(var(--i, 0) * 70ms);}

@media (prefers-reduced-motion: reduce) {
  .stb-digit[data-pop] { animation: none; }
}

/* the plot: absolutely placed columns, each segment its own rounded box */
.stb-plot { position: relative; width: 100%; touch-action: none; cursor: crosshair; }

.stb-base {
  position: absolute;
  left: 0;
  right: 0;
  height: 1px;
  background: var(--stb-w12);}

.stb-col { position: absolute; top: 0; bottom: 0; }

.stb-bar,
.stb-esc {
  position: absolute;
  left: 0;
  right: 0;
  border-radius: var(--stb-r);
  transition:
    height 600ms cubic-bezier(0.22, 1, 0.36, 1) calc(var(--i) * 14ms),
    bottom 600ms cubic-bezier(0.22, 1, 0.36, 1) calc(var(--i) * 14ms),
    background-color 160ms ease;}

.stb-bar { background-color: var(--c); }

.stb-esc { background-color: var(--stb-alert); }

/* Mono: escalated is full ink, hatched, so it never reads as Identity */
.stb[data-colour="off"] .stb-esc {
  background-image: repeating-linear-gradient(-45deg, transparent 0 1.5px, var(--fill-slab, #ffffff) 1.5px 3px);}

/* scrubbing: the others step back by mixing toward the slab */
.stb[data-scrub] .stb-col:not([data-on]) .stb-bar {
  background-color: color-mix(in srgb, var(--c) 38%, var(--fill-slab, #ffffff));}

.stb[data-scrub] .stb-col:not([data-on]) .stb-esc {
  background-color: color-mix(in srgb, var(--stb-alert) 38%, var(--fill-slab, #ffffff));}

.stb-ring {
  position: absolute;
  top: 0;
  left: 0;
  box-sizing: border-box;
  border: 1.5px solid var(--stb-mute);
  border-radius: var(--stb-rr);
  pointer-events: none;
  opacity: 0;
  transition: opacity 160ms ease;}

.stb[data-scrub] .stb-ring { opacity: 1; }

/* the tooltip: beside the column, gliding on a spring */
.stb-tip {
  position: absolute;
  top: 0;
  left: 0;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 8px 10px;
  border-radius: 10px;
  background: var(--fill-slab, #ffffff);
  /* filled like the card, parted from the bars by a soft grey hairline */
  border: 1px solid color-mix(in srgb, var(--fill-on, #17181a) 10%, var(--fill-slab, #ffffff));
  font-size: 12px;
  line-height: 16px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 160ms ease;}

.stb[data-scrub] .stb-tip { opacity: 1; }

.stb-tip-head,
.stb-tip-row { display: flex; align-items: center; gap: 6px; white-space: nowrap; }

.stb-tip-head { justify-content: space-between; color: var(--stb-mute); margin-bottom: 2px; }

.stb-tip b { font-weight: 500; font-variant-numeric: tabular-nums; color: var(--fill-on, #17181a); }

.stb-tip-row span { flex: 1; color: var(--stb-soft); }

.stb-tip-row b { font-weight: 400; }

.stb-tip-row i {
  flex: none;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  background-color: var(--c);}

.stb-tip-row[data-esc] i { background-color: var(--stb-alert); }

.stb[data-colour="off"] .stb-tip-row[data-esc] i {
  background-image: repeating-linear-gradient(-45deg, transparent 0 1.5px, var(--fill-slab, #ffffff) 1.5px 3px);}

/* one tiny footer: first and last date */
.stb-axis {
  display: flex;
  justify-content: space-between;
  margin-top: -8px;
  font-size: 11px;
  line-height: 14px;
  color: var(--stb-faint);
  font-variant-numeric: tabular-nums;}

@keyframes stb-pop {
  from { transform: translateY(0.18em); opacity: 0; filter: blur(2px); }
  to { transform: none; opacity: 1; filter: blur(0); }}

/* ── Bencho tokens, mapped to this dashboard ───────────────
   --fill-on   the ink: the dashboard's own text colour
   --fill-slab the surface the bars sit on: a solid tone matching the dense glass cards,
               solid so the "step back" mix and the tooltip stay opaque over the scenery
   --font-ui   the dashboard's UI face
   --pane-edge the dashboard's soft hairline
   --c, --i, --stb-r and --stb-rr are not tokens: the script sets them per element.
   Defined on the component's own root, so nothing leaks into the page. */
.stb {
  --fill-on: var(--text);
  --fill-slab: #161a22;
  --font-ui: var(--sans);
  --pane-edge: var(--edge-soft);
  max-width: 100%;}
/* Colour, in the dashboard's palette: one hue per stress source, and the bars under the
   baseline (what calmed it) in the dashboard's "good" teal instead of an alert red */
.stb[data-colour="on"] {
  --stb-c1: #b9a8ff; --stb-c2: #ffb38a; --stb-c3: #7d9bff;
  --stb-c4: #f6cd72; --stb-c5: #f59384; --stb-c6: #e57bb8;
  --stb-alert: var(--ok);}
.stb-tab:focus-visible, .stb-plot:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
/* the morning open on the dashboard keeps a small mark under its column */
.stb-col[data-sel]::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--fill-on); }
.stb-plot { cursor: pointer; }

/* import / connect */

.modeseg button:focus-visible{outline:2px solid var(--text);outline-offset:1px}
.mpane{display:grid;gap:10px;align-content:start}

.slot{display:grid;gap:6px;align-content:start;background:rgba(0,0,0,.2);border-radius:16px;padding:14px}

.slot .ghost{justify-self:start;margin-top:4px}

/* thermal lens (after Bencho's Heat word) */
.thermal,.brainfig canvas.thermal{position:absolute;left:0;top:0;pointer-events:none;z-index:3;mix-blend-mode:normal}

.threw{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.threw .muted{max-width:46ch}
.thpick{display:flex;gap:4px;padding:2px;border-radius:999px;background:rgba(0,0,0,.25)}

.thchip[aria-pressed="true"]{background:rgba(255,255,255,.9);color:var(--ink)}
.thchip:focus-visible{outline:2px solid var(--text);outline-offset:1px}

/* brain */
.brainwrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.brainwrap{grid-template-columns:minmax(0,1fr)}}

.bshell{fill:rgba(255,255,255,.06);stroke:rgba(255,255,255,.22);stroke-width:1}
.bsulc{fill:none;stroke:rgba(255,255,255,.12);stroke-width:1.1;stroke-linecap:round}

.breg:hover{stroke:rgba(255,255,255,.85)}

.blabel{font:600 10px Figtree,system-ui,sans-serif;fill:rgba(235,240,247,.75);pointer-events:none;letter-spacing:.04em}
.regions{display:grid;gap:8px}

/* liquid glass: the material lives on its own layer (.gfx) behind the content.
   Text and icons stay opaque and still; only the glass refracts, warps and ripples. */
.glass{position:relative;isolation:isolate}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.2px;pointer-events:none;z-index:4;
  background:radial-gradient(160px circle at var(--mx,30%) var(--my,0%),rgba(255,255,255,.95),rgba(255,255,255,.28) 45%,rgba(255,255,255,.10) 70%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.glass > *{position:relative;z-index:1}
.glass > .tchrome,.glass > .rsz,.glass > .spanbadge{position:absolute;z-index:6}
.glass.dense{background:linear-gradient(140deg,rgba(24,28,38,.46),rgba(12,15,22,.36))}
.glass.has-gfx{background:none !important;border-color:transparent !important;box-shadow:none !important;-webkit-backdrop-filter:none !important;backdrop-filter:none !important}
.glass.has-gfx::before{display:none}
.glass > .gfx{position:absolute;inset:-1px;z-index:-1;border-radius:inherit;pointer-events:none;
  background:linear-gradient(140deg,rgba(255,255,255,.16),rgba(255,255,255,.05) 60%);border:1px solid var(--edge);
  -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
